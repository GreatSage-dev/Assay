<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assay On-Chain Registration</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #161c2e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 550px;
            width: 100%;
            border: 1px solid #2a344d;
        }
        h2 { margin-top: 0; color: #60a5fa; }
        .field { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }
        button:hover { background: linear-gradient(135deg, #1d4ed8, #1e40af); }
        #status { margin-top: 20px; word-break: break-all; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
        .success { color: #4ade80; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Assay On-Chain Registration (High Separation Update)</h2>
        <p style="font-size: 14px; color: #cbd5e1;">Submit your updated Assay WebAssembly scoring module directly to the Telegraph Diamond contract on Base Sepolia.</p>

        <div class="field">
            <label>Diamond Contract</label>
            <input type="text" id="contract" value="0x5a2324aA18613FAD4e44bDF0d6c73Ec1f6D87ff8" readonly>
        </div>

        <div class="field">
            <label>WASM Hash (bytes32)</label>
            <input type="text" id="wasmHash" value="0x111a5ea2e2d9eb426a5ba0e61b9cd22042ac5e1187785004a64e23bd769e4cb3" readonly>
        </div>

        <div class="field">
            <label>WASM Raw URL</label>
            <input type="text" id="wasmUrl" value="https://raw.githubusercontent.com/GreatSage-dev/Assay/main/assay.wasm" readonly>
        </div>

        <div class="field">
            <label>Intent</label>
            <input type="text" id="intent" value="FACT_CHECK" readonly>
        </div>

        <button id="regBtn" onclick="registerOnChain()">Connect Rabby / Wallet & Register On-Chain</button>
        <div id="status"></div>
    </div>

    <script>
        const contractAddress = "0x5a2324aA18613FAD4e44bDF0d6c73Ec1f6D87ff8";
        const abi = [
            "function registerWasm(bytes32 wasmHash, string memory wasmUrl, string memory intent) external"
        ];

        async function registerOnChain() {
            const statusDiv = document.getElementById("status");
            const btn = document.getElementById("regBtn");

            const walletProvider = window.rabby || window.ethereum;

            if (!walletProvider) {
                statusDiv.className = "error";
                statusDiv.innerText = "Rabby or Web3 wallet is not detected in your browser!";
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Connecting Rabby Wallet...";
                statusDiv.className = "";
                statusDiv.innerText = "Requesting Rabby wallet connection...";

                const provider = new ethers.providers.Web3Provider(walletProvider);
                await provider.send("eth_requestAccounts", []);
                
                // Ensure Base Sepolia Network (Chain ID 84532 / 0x14a34)
                const network = await provider.getNetwork();
                if (network.chainId !== 84532) {
                    try {
                        await walletProvider.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x14a34' }],
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902 || switchError.code === -32603) {
                            await walletProvider.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: '0x14a34',
                                    chainName: 'Base Sepolia Testnet',
                                    rpcUrls: ['https://sepolia.base.org'],
                                    nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                                    blockExplorerUrls: ['https://sepolia.basescan.org']
                                }]
                            });
                        }
                    }
                }

                const signer = provider.getSigner();
                const address = await signer.getAddress();
                btn.innerText = "Confirming Transaction in Rabby...";
                statusDiv.innerText = `Connected: ${address}\nSending registerWasm transaction...`;

                const contract = new ethers.Contract(contractAddress, abi, signer);
                
                const tx = await contract.registerWasm(
                    document.getElementById("wasmHash").value,
                    document.getElementById("wasmUrl").value,
                    document.getElementById("intent").value
                );

                statusDiv.innerText = `Transaction Sent!\nHash: ${tx.hash}\nWaiting for network confirmation...`;

                await tx.wait();
                
                btn.innerText = "Registration Complete!";
                statusDiv.className = "success";
                statusDiv.innerHTML = `SUCCESS! Assay module registered on-chain.<br><br><a href="https://sepolia.basescan.org/tx/${tx.hash}" target="_blank" style="color:#4ade80;">View Transaction on BaseScan ↗</a>`;
            } catch (err) {
                btn.disabled = false;
                btn.innerText = "Connect Rabby / Wallet & Register On-Chain";
                statusDiv.className = "error";
                statusDiv.innerText = "Error: " + (err.reason || err.message || JSON.stringify(err));
            }
        }
    </script>
</body>
</html>
